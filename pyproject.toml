[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-triage"
version = "0.1.0"
description = "Trustworthy chest X-ray triage: calibrated multi-label classification with uncertainty-aware referral, Grad-CAM, and a FastAPI service."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "matplotlib>=3.7",
  "medmnist>=3.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
cxr-train = "cxr_triage.train:main"
cxr-evaluate = "cxr_triage.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's File(...) default is idiomatic
